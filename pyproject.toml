[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-search"
version = "0.1.0"
description = "Customer Search feature implementing spec-driven development"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ADA-05 Developer" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
customer-search = "customer_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

